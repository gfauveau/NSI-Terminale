<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminale NSI : Récapitulatif des cours et exercices types</title>
    <link rel="stylesheet" href="style.css">
    <!-- Configuration MathJax pour le rendu des formules LaTeX -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <!-- Pyodide pour l'exécution Python côté client -->
    <script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
</head>
<body>
    <header class="glass-header">
        <div class="header-content">
            <span class="badge">NSI • Terminale</span>
            <h1>Terminale : récapitulatif des cours et exercices types</h1>
            <p class="subtitle">Sélectionne une séance pour accéder à la fiche de synthèse, aux exercices types et au bac à sable Python</p>
        </div>
    </header>

    <main class="container">
        <!-- Vue 1 : Grille de carrés indépendants pour chaque séance -->
        <section id="sessions-grid-view" class="sessions-grid">
            <!-- Cartes générées dynamiquement par app.js -->
        </section>

        <!-- Vue 2 : Détail d'une séance + IDE Python (masquée par défaut) -->
        <section id="session-detail-view" class="hidden">
            <button id="back-btn" class="btn-back">← Retour aux séances</button>

            <div id="course-container" class="glass-panel">
                <!-- Contenu de la séance active -->
            </div>

            <!-- IDE Python interactif -->
            <div class="ide-container glass-panel">
                <div class="ide-header">
                    <h3>Bac à sable Python (Pyodide)</h3>
                    <div class="ide-actions">
                        <span id="pyodide-status" class="status-loading">Chargement de Python...</span>
                        <button id="run-btn" class="btn-primary" disabled>▶ Exécuter</button>
                        <button id="clear-btn" class="btn-secondary">Effacer console</button>
                    </div>
                </div>
                <textarea id="python-editor" spellcheck="false" placeholder="# Écris ou charge un exercice ici..."></textarea>
                <div class="console-wrapper">
                    <div class="console-label">Sortie console :</div>
                    <pre id="python-output"></pre>
                </div>
            </div>
        </section>
    </main>

    <script src="python-ide.js"></script>
    <script src="app.js"></script>
</body>
</html>
